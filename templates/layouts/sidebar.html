{% load static %}
<aside id="sidebar"
class="bg-white h-screen fixed left-0 top-0 shadow-sm flex flex-col justify-between z-50
w-64 border-r border-slate-200 transition-transform duration-300
-translate-x-full lg:translate-x-0">

  <!-- Logo -->
  <div class="p-5 border-b border-slate-100 flex-shrink-0">
    <a href="{% url 'dashboard:landing' %}">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-600/20">
          <i data-lucide="box" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-xl font-bold text-slate-900 tracking-tight">
          CustomerFlow
        </span>
      </div>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    <!-- Main -->
    <p class="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
      Main Menu
    </p>

    <a href="{% url 'dashboard:home' %}"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition
    {% if request.resolver_match.url_name == 'home' %}
      bg-blue-50 text-blue-700
    {% else %}
      text-slate-600 hover:bg-slate-50 hover:text-slate-900
    {% endif %}">
      <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      Dashboard
    </a>

    <a href="{% url 'orders:list' %}"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition
    {% if request.resolver_match.url_name == 'list' and request.resolver_match.app_name == 'orders' %}
      bg-blue-50 text-blue-700
    {% else %}
      text-slate-600 hover:bg-slate-50 hover:text-slate-900
    {% endif %}">
      <i data-lucide="package" class="w-5 h-5"></i>
      Orders
    </a>

    <a href="{% url 'customers:list' %}"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition
    {% if request.resolver_match.app_name == 'customers' %}
      bg-blue-50 text-blue-700
    {% else %}
      text-slate-600 hover:bg-slate-50 hover:text-slate-900
    {% endif %}">
      <i data-lucide="users" class="w-5 h-5"></i>
      Customers
    </a>

    <a href="#"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900">
      <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
      Reports
    </a>

    <!-- Communication -->
    <p class="px-3 py-2 mt-6 text-xs font-semibold text-slate-400 uppercase tracking-wider">
      Communication
    </p>

    <a href="#"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900">
      <i data-lucide="bell" class="w-5 h-5"></i>
      Notifications
      <span class="ml-auto bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded-full">0</span>
    </a>

    <!-- Organization -->
    <p class="px-3 py-2 mt-6 text-xs font-semibold text-slate-400 uppercase tracking-wider">
      Organization
    </p>

    <a href="#"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900">
      <i data-lucide="user" class="w-5 h-5"></i>
      Profile
    </a>

    <a href="{% url 'workflows:list' %}"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition
    {% if request.resolver_match.app_name == 'workflows' %}
      bg-blue-50 text-blue-700
    {% else %}
      text-slate-600 hover:bg-slate-50 hover:text-slate-900
    {% endif %}">
      <i data-lucide="layout" class="w-5 h-5"></i>
      Workflow
    </a>

    <!-- Admin -->
    {% if user.role == 'admin' %}
    <p class="px-3 py-2 mt-6 text-xs font-semibold text-slate-400 uppercase tracking-wider">
      Team
    </p>

    <a href="{% url 'accounts:invite_staff' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">
      <i data-lucide="user-plus" class="w-5 h-5"></i>
      Invite Team Member
    </a>

    <a href="{% url 'accounts:organization_members' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">
      <i data-lucide="users" class="w-5 h-5"></i>
      Team Members
    </a>

    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">
      <i data-lucide="lock" class="w-5 h-5"></i>
      Roles & Permissions
    </a>
    {% endif %}

    <!-- Help -->
    <p class="px-3 py-2 mt-6 text-xs font-semibold text-slate-400 uppercase tracking-wider">
      Other
    </p>

    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">
      <i data-lucide="help-circle" class="w-5 h-5"></i>
      Help & Support
    </a>

    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      Feedback
    </a>

  </nav>

  <!-- User Section -->
  <div class="p-4 border-t flex-shrink-0 relative">

    <button id="sidebarUserBtn"
    class="flex items-center gap-3 w-full p-3 rounded-xl bg-slate-50 hover:bg-slate-100 transition">

      <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-md">
        {{ user.first_name|slice:":1" }}{{ user.last_name|slice:":1" }}
      </div>

      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-900 truncate">
          {{ user.first_name }} {{ user.last_name }}
        </p>
        <p class="text-xs text-slate-500 truncate">
          {{ user.email }}
        </p>
      </div>

      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>

    </button>

    <!-- Dropdown -->
    <div id="sidebarUserMenu"
    class="hidden absolute left-full md:left-auto md:right-0 top-0 mt-2 w-44
    bg-white border border-slate-200 rounded-xl shadow-lg z-50">

      <form method="post" action="{% url 'dashboard:logout' %}">
        {% csrf_token %}
        <button type="submit"
        class="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-xl">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        Logout
        </button>
      </form>

    </div>

  </div>

</aside>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const btn = document.getElementById("sidebarUserBtn");
    const menu = document.getElementById("sidebarUserMenu");

    if (!btn || !menu) return;

    btn.addEventListener("click", function (e) {
        e.stopPropagation();
        menu.classList.toggle("hidden");
    });

    document.addEventListener("click", function (e) {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
            menu.classList.add("hidden");
        }
    });

});
</script>
