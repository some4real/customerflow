{% load static %}
<header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200/80">
    <div class="flex items-center justify-between px-4 md:px-6 lg:px-8 h-16">

        <!-- Mobile menu button -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-slate-100 transition-colors">
            <i data-lucide="menu" class="w-5 h-5 text-slate-600"></i>
        </button>

        <!-- Search Bar (Desktop) -->
        <form method="GET" action="{% url 'dashboard:home' %}" class="hidden md:flex items-center flex-1 max-w-md">
            <div class="relative w-full">
                <i data-lucide="search"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>

                <input 
                    type="text"
                    name="q"
                    value="{{ request.GET.q }}"
                    placeholder="Search orders, customers..."
                    class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm md:text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                >

                <!-- Clear (X) Button -->
                <button type="button" onclick="this.previousElementSibling.value='';" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>

                <kbd class="absolute right-10 top-1/2 -translate-y-1/2 hidden lg:inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium text-slate-400 bg-slate-100 rounded">
                    <span>⌘</span>K
                </kbd>
            </div>
        </form>

        <!-- Right Actions -->
        <div class="flex items-center gap-2 md:gap-3">

            <!-- Mobile Search Button -->
            <button id="mobileSearchBtn" class="md:hidden p-2 rounded-lg hover:bg-slate-100 transition-colors">
                <i data-lucide="search" class="w-5 h-5 text-slate-600"></i>
            </button>

            <!-- Notifications -->
            <button class="relative p-2 rounded-lg hover:bg-slate-100 transition-colors">
                <i data-lucide="bell" class="w-5 h-5 text-slate-600"></i>
                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-blue-600 rounded-full ring-2 ring-white"></span>
            </button>

            <!-- Settings -->
            <button class="hidden sm:flex p-2 rounded-lg hover:bg-slate-100 transition-colors">
                <i data-lucide="settings" class="w-5 h-5 text-slate-600"></i>
            </button>

            <!-- Divider -->
            <div class="hidden sm:block w-px h-8 bg-slate-200"></div>

            <!-- User Avatar (Desktop) -->
            <div class="hidden sm:flex items-center gap-3 pl-2 relative">

                <div class="text-right">
                    <p class="text-sm font-medium text-slate-900">
                        {{ user.first_name }} {{ user.last_name }}
                    </p>
                    <p class="text-xs text-slate-500">{{ user.role }}</p>
                </div>

                <button onclick="toggleUserMenu()" class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-md cursor-pointer hover:shadow-lg transition-shadow">
                    {{ user.first_name|slice:":1" }}{{ user.last_name|slice:":1" }}
                </button>

                <!-- Dropdown -->
                <div id="userMenu" class="hidden absolute right-0 top-14 w-44 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                    <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
                        <i data-lucide="user" class="w-4 h-4"></i>
                        Profile
                    </a>
                    <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                        Settings
                    </a>
                    <div class="border-t border-slate-200"></div>
                    <form method="post" action="{% url 'dashboard:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Search Bar -->
    <div id="mobileSearchContainer" class="hidden px-4 pb-2">
        <form method="GET" action="{% url 'dashboard:home' %}">
            <div class="relative w-full">
                <input
                    type="text"
                    name="q"
                    value="{{ request.GET.q }}"
                    placeholder="Search orders, customers..."
                    class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                >
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <button type="button" onclick="this.previousElementSibling.value='';" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </form>
    </div>
</header>

<script>
function toggleUserMenu() {
    const menu = document.getElementById("userMenu");
    menu.classList.toggle("hidden");
}

// Mobile Search Toggle
document.getElementById("mobileSearchBtn").addEventListener("click", function() {
    const container = document.getElementById("mobileSearchContainer");
    container.classList.toggle("hidden");
    container.querySelector("input").focus();
});

// Close user menu when clicking outside
document.addEventListener("click", function(event) {
    const menu = document.getElementById("userMenu");
    const avatar = event.target.closest("button");
    if (!avatar && !menu.contains(event.target)) {
        menu.classList.add("hidden");
    }
});

// Keyboard shortcut (⌘/Ctrl + K)
document.addEventListener("keydown", function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault()
        document.querySelector("input[name='q']").focus()
    }
});
</script>
